<script>
const DATA=/*__DATA__*/{"auteuil":[],"beaugrenelle":[]}/*__ENDDATA__*/;
const CATALOG=/*__CAT__*/{}/*__ENDCAT__*/;
/* Hors de claude.ai (Vercel) : identifiants publics du projet Firebase, injectés par build.py depuis firebase-config.json. */
const FIREBASE_CONFIG=/*__FB__*/null/*__ENDFB__*/;

/* ---------- Référentiels ---------- */
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DAYKEYS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const CATS=[['force','Force'],['cardio','Cardio'],['mobilite','Mobilité']];
const BOOK_AHEAD=6; /* inscriptions ouvertes 6 jours avant le cours */
const CAT_OF={'SKILL':'force','WOD':'force','TRX FORCE':'force','TRX BENCH':'force','CORE':'force','HYROX':'force',
  'RPM':'cardio','SPRINT':'cardio','BOXING BAG':'cardio','TRX CROSS':'cardio','STRENGTH':'cardio','CEREMONY':'cardio',
  'BODY BALANCE':'mobilite','REFORMER':'mobilite','TRX MOBILITÉ':'mobilite','PILATES':'mobilite','YOGA':'mobilite','GYM BASIC':'mobilite'};
const STYLE={'SKILL':['#5b2d82','#fff'],'WOD':['#d9582f','#1a0a04'],'TRX FORCE':['#fbe34a','#151514'],'TRX BENCH':['#fbe34a','#151514'],
  'TRX CROSS':['#fbe34a','#151514'],'TRX MOBILITÉ':['#fbe34a','#151514'],'CORE':['#cf6a33','#1a0a04'],'RPM':['#2c7bb8','#fff'],
  'SPRINT':['#2b2f63','#fff'],'BOXING BAG':['#a82e2e','#fff'],'BODY BALANCE':['#b3c77e','#151514'],'REFORMER':['#9bbde3','#151514'],
  'PILATES':['#9bbde3','#151514'],'YOGA':['#9bbde3','#151514'],'GYM BASIC':['#b4c3ea','#151514']};
const BANDS=['7h00','8h15','9h30 – 10h45','12h00 – 13h15','14h45 – 16h00','17h15','18h30','19h45','21h00'];
const NB=BANDS.length;
function bandOf(min){return min<480?0:min<540?1:min<720?2:min<840?3:min<1020?4:min<1080?5:min<1170?6:min<1230?7:8}
const MODES={B:'Bureau',T:'TT',L:'Libre',X:'Indispo'};
const PRESET={B:'000100221',T:'110200221',L:'112111111',X:'000000000'};
const DEFAULT_MODES='BBBBBLL';
const DEFAULT_AVAIL=DEFAULT_MODES.split('').map(m=>PRESET[m]).join('');
const PEOPLE=['p1','p2','p3'];
const CLUBS={auteuil:'Auteuil',beaugrenelle:'Beaugrenelle'};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
function applyPatch(t,p){for(const k in p){const v=p[k];if(v===null)delete t[k];else if(isObj(v))t[k]=applyPatch(isObj(t[k])?t[k]:{},v);else t[k]=v}return t}
function mergePatch(t,p){for(const k in p){const v=p[k];if(isObj(v))t[k]=mergePatch(isObj(t[k])?t[k]:{},v);else t[k]=v}return t}
function stripNulls(o){const r={};for(const k in o){const v=o[k];if(v===null)continue;r[k]=isObj(v)?stripNulls(v):v}return r}

/* ---------- Dates ---------- */
function mondayKey(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return fmtKey(x)}
function fmtKey(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function keyDate(k,add){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d+(add||0))}
function shiftWeek(k,n){return fmtKey(keyDate(k,7*n))}
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function dayLabel(k,i){const d=keyDate(k,i);return d.getDate()+' '+MONTHS[d.getMonth()]}
function defaultWeek(){const now=new Date();const k=mondayKey(now);return ((now.getDay()+6)%7)>=2?shiftWeek(k,1):k} /* dès mercredi, les inscriptions de la semaine suivante sont déjà ouvertes */

/* ---------- Stockage (base partagée de l'artifact, sinon cet appareil) ---------- */
const Store=(()=>{
  const docs={},pend={},inflight={},timers={};
  let db=null,mode='pending',loaded={},stale=false,dead=false,onChange=()=>{};
  const COLLS=['profiles','group','weeks'];
  const ls={get(k){try{const v=localStorage.getItem('fds:'+k);return v?JSON.parse(v):null}catch(e){return null}},
            set(k,v){try{localStorage.setItem('fds:'+k,JSON.stringify(v))}catch(e){}}};
  function get(path){let d=clone(docs[path])||{};if(inflight[path])applyPatch(d,inflight[path]);if(pend[path])applyPatch(d,pend[path]);return d}
  function exists(path){return docs[path]!=null}
  function write(path,patch){
    if(mode==='pending'||dead)return false;
    pend[path]=mergePatch(pend[path]||{},clone(patch));onChange();
    clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),mode==='local'?0:450);return true}
  function flush(path){
    if(!pend[path])return;
    if(mode==='local'){const d=applyPatch(clone(docs[path])||{},pend[path]);delete pend[path];docs[path]=d;
      const all=ls.get('docs')||{};all[path]=d;ls.set('docs',all);onChange();return}
    if(inflight[path])return;
    const patch=pend[path];delete pend[path];inflight[path]=patch;
    const ref=db.doc(path);
    const p=exists(path)?ref.update(patch):ref.set(stripNulls(patch));
    p.then(()=>{if(!exists(path))docs[path]=stripNulls(patch);else docs[path]=applyPatch(clone(docs[path]),patch);delete inflight[path];onChange();if(pend[path])flush(path)},
      e=>{delete inflight[path];if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){dead=true;toast(groupCode?'Modification refusée par la base : vérifie les règles Firebase.':'Tu peux consulter, mais pas modifier : demande un accès « Contributeur ».')}
        else toast('Enregistrement impossible pour le moment. Réessaie dans un instant.');onChange()})}
  /* Base Firebase (site hébergé hors de claude.ai). Les données d'un groupe vivent sous groups/<code secret>/… ;
     le code vient du lien (?g=…), il est gardé sur l'appareil, et il en est créé un nouveau s'il n'y en a pas. */
  let groupCode=null;
  function pickGroup(){let g=null;
    try{g=new URLSearchParams(location.search).get('g')}catch(e){}
    if(!g||!/^[A-Za-z0-9]{20,64}$/.test(g)){try{g=localStorage.getItem('fds:g')}catch(e){}}
    if(!g||!/^[A-Za-z0-9]{20,64}$/.test(g)){const abc='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',r=new Uint8Array(28);crypto.getRandomValues(r);g=Array.from(r,x=>abc[x%abc.length]).join('')}
    try{localStorage.setItem('fds:g',g)}catch(e){}
    try{const u=new URL(location.href);if(u.searchParams.get('g')!==g){u.searchParams.set('g',g);history.replaceState(null,'',u.toString())}}catch(e){}
    return g}
  async function cloudDb(){
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [{initializeApp},fs]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js')]);
    const fdb=fs.getFirestore(initializeApp(FIREBASE_CONFIG));groupCode=pickGroup();
    const conv=o=>{const r={};for(const k in o){const v=o[k];r[k]=v===null?fs.deleteField():isObj(v)?conv(v):v}return r};
    const err=e=>({code:e&&e.code==='permission-denied'?'not_granted':'unavailable'});
    return {
      collection:c=>({onSnapshot:(next,fail)=>fs.onSnapshot(fs.collection(fdb,'groups',groupCode,c),
        snap=>next({docs:snap.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:{fromCache:snap.metadata.fromCache}}),e=>fail(err(e)))}),
      doc:path=>{const [c,id]=path.split('/'),ref=fs.doc(fdb,'groups',groupCode,c,id);
        return {update:p=>fs.setDoc(ref,conv(p),{merge:true}).catch(e=>{throw err(e)}),set:d=>fs.setDoc(ref,d).catch(e=>{throw err(e)})}}}}
  function startLocal(){mode='local';const all=ls.get('docs')||{};for(const k in all)docs[k]=all[k];COLLS.forEach(c=>loaded[c]=true);onChange()}
  async function init(cb){onChange=cb;
    let d=null;try{d=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){d=null}
    if(!d&&FIREBASE_CONFIG&&!(window.claude&&window.claude.use)){try{d=await cloudDb()}catch(e){d=null;groupCode=null}}
    if(!d){startLocal();return}
    db=d;mode='shared';
    const timer=setTimeout(()=>{stale=true;onChange()},10000);
    COLLS.forEach(c=>{db.collection(c).onSnapshot(snap=>{
        const seen={};snap.docs.forEach(s=>{seen[c+'/'+s.id]=1;docs[c+'/'+s.id]=clone(s.data())});
        for(const k in docs)if(k.startsWith(c+'/')&&!seen[k])delete docs[k];
        loaded[c]=true;if(!snap.metadata.fromCache&&COLLS.every(x=>loaded[x])){clearTimeout(timer);stale=false}
        onChange()},
      e=>{loaded[c]=true;clearTimeout(timer);dead=true;onChange()})});
    onChange()}
  return {get,exists,write,init,
    get mode(){return mode},get ready(){return mode!=='pending'&&COLLS.every(c=>loaded[c])},get stale(){return stale},get readonly(){return dead},
    /* Lien à envoyer aux deux autres (seulement en mode Firebase). */
    get link(){if(!groupCode)return null;try{const u=new URL(location.href);u.hash='';u.search='?g='+groupCode;return u.toString()}catch(e){return null}}}
})();

/* ---------- État d'interface ---------- */
const ui={tab:'semaine',week:defaultWeek(),me:null,edit:'p1',cat:'all',together:false,day:0,scope:'week',swap:null,showAll:false,arm:null,menu:false};
try{ui.me=localStorage.getItem('fds:me')||null;if(ui.me)ui.edit=ui.me}catch(e){}

const settings=()=>Store.get('group/settings');
const club=()=>'auteuil'; /* le club du groupe ; Beaugrenelle ne sert que pour un cours choisi à la main */
const weekPath=(k)=>'weeks/'+club()+'_'+(k||ui.week);
const week=(k)=>Store.get(weekPath(k));
const profile=p=>Store.get('profiles/'+p);
const NAMES={p1:'Cece',p2:'Coco',p3:'Clem'}; /* prénoms fixes */
const pname=p=>NAMES[p];
const initial=p=>{const n=NAMES[p];for(let k=1;k<=3;k++){const me=n.slice(0,k).toLowerCase();if(PEOPLE.every(q=>q===p||NAMES[q].slice(0,k).toLowerCase()!==me))return n.slice(0,k)}return n.slice(0,2)};
function availOf(p,k){const w=week(k).avail;const o=w&&w[p];const pr=profile(p);
  const a=(o&&o.a)||pr.avail||DEFAULT_AVAIL, m=(o&&o.m)||pr.modes||DEFAULT_MODES;
  return {a:a.length===7*NB?a:DEFAULT_AVAIL,m:m.length===7?m:DEFAULT_MODES,custom:!!o}}
/* La semaine type seule, sans tenir compte d'une semaine personnalisée. */
function typeAvail(p){const pr=profile(p),a=pr.avail||DEFAULT_AVAIL,m=pr.modes||DEFAULT_MODES;
  return {a:a.length===7*NB?a:DEFAULT_AVAIL,m:m.length===7?m:DEFAULT_MODES,custom:false}}
/* Ce qu'on affiche et modifie dans l'onglet Dispos, selon l'onglet « Semaine type » ou « Semaine du … ». */
function editAvail(p){return ui.scope==='week'?availOf(p):typeAvail(p)}
const prefOf=(p,course)=>{const v=(profile(p).prefs||{})[course];return v===0||v===2?v:1};

/* ---------- Créneaux ---------- */
const slotCache={};
function clubSlots(c){if(slotCache[c])return slotCache[c];const seen={},pre=c==='auteuil'?'':'bg_';
  const out=(DATA[c]||[]).map(r=>{const [studio,day,time,course,coach]=r;const [h,m]=time.split(':').map(Number);
    let id=pre+day+'-'+time.replace(':','')+'-'+course.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'');
    if(seen[id])id+='-'+(++seen[id]);else seen[id]=1;
    const meta=CATALOG[course]||{};
    return {id,club:c,studio,day,time,min:h*60+m,band:bandOf(h*60+m),course,coach,cat:CAT_OF[course]||null,dur:meta.dur||null,max:meta.max||null}});
  out.sort((a,b)=>a.day-b.day||a.min-b.min||a.course.localeCompare(b.course));
  return slotCache[c]=out}
function slots(){return clubSlots('auteuil')}
/* Par défaut on propose les deux clubs, Auteuil de préférence. Une case peut être limitée à un seul lieu. */
const lieuAt=(d,b)=>{const v=(week().lieu||{})[d+'-'+b];return v==='auteuil'||v==='beaugrenelle'?v:null};
let candCache=null;
function candidates(){if(!candCache)candCache=clubSlots('auteuil').concat(clubSlots('beaugrenelle')).sort((a,b)=>a.day-b.day||a.min-b.min||a.course.localeCompare(b.course)||(a.club<b.club?-1:1));
  const l=week().lieu||{};if(!Object.keys(l).length)return candCache;
  return candCache.filter(s=>{const v=lieuAt(s.day,s.band);return !v||v===s.club})}
const GYM_TIMES=['07:00','08:15','09:30','10:45','12:00','12:30','13:15','14:45','16:00','17:15','18:30','19:45','21:00'];
function gymSlot(id){const m=/^gym_(\d)-(\d{2})(\d{2})$/.exec(id);if(!m)return null;const mn=+m[2]*60+ +m[3];
  return {id,gym:true,club:'auteuil',studio:'Salle',day:+m[1],time:m[2]+':'+m[3],min:mn,band:bandOf(mn),course:'SALLE',coach:'Accès libre',cat:null,dur:null,max:null}}
/* Qui vient à une séance de salle : {p1:true,…}. Une ancienne séance notée « true » vaut pour les trois. */
function gymPart(key){const v=(week().gym||{})[key];if(v===true){const o={};PEOPLE.forEach(p=>o[p]=true);return o}
  if(isObj(v)&&PEOPLE.some(p=>v[p])){const o={};PEOPLE.forEach(p=>o[p]=!!v[p]);return o}return null}
function gymWho(g){const part=gymPart(g.id.slice(4))||{};return PEOPLE.map(p=>({p,a:1,pr:1,ok:!!part[p]}))}
const gymList=()=>Object.keys(week().gym||{}).filter(k=>gymPart(k)).map(k=>gymSlot('gym_'+k)).filter(Boolean);
const slotById=id=>String(id).startsWith('gym_')?gymSlot(id):clubSlots(String(id).startsWith('bg_')?'beaugrenelle':'auteuil').find(s=>s.id===id);

const hhmm=t=>t.replace(':','h').replace(/^0/,'');
const DSHORT=['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
function today0(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
/* État d'inscription d'un créneau pour la semaine affichée : ouvert à partir de J-6. */
function booking(s){const cls=keyDate(ui.week,s.day),open=keyDate(ui.week,s.day-BOOK_AHEAD),t=today0();
  const dOpen=Math.round((open-t)/864e5),dCls=Math.round((cls-t)/864e5);
  const lbl=DSHORT[(open.getDay()+6)%7]+' '+open.getDate()+' '+MONTHS[open.getMonth()];
  if(dCls<0)return {st:'past',txt:'Cours passé',cls:''};
  if(dOpen<=0)return {st:'open',txt:'Inscriptions ouvertes',cls:'ok',open,lbl};
  return {st:'soon',txt:'Inscription dès '+(dOpen===1?'demain':lbl),cls:'warn',open,lbl,dOpen}}
/* Dispos de la semaine à confirmer avant la première ouverture d'inscriptions (le lundi s'ouvre le mardi d'avant). */
const DLONG=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const longDate=d=>DLONG[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTHS[d.getMonth()];
function confirmInfo(){const firstOpen=keyDate(ui.week,-BOOK_AHEAD),deadline=keyDate(ui.week,-BOOK_AHEAD-1);
  const conf=week().confirmed||{},done=PEOPLE.filter(p=>conf[p]),left=Math.round((deadline-today0())/864e5);
  return {firstOpen,deadline,conf,done,all:done.length===3,left}}
function placesOf(id){const p=(week().places||{})[id];return typeof p==='number'?p:null}

/* Qui peut venir à ce créneau : dispo (1 possible, 2 idéal) et pas de veto sur le cours. */
function who(s){const out=(week().out||{})[s.id]||{};
  return PEOPLE.map(p=>{const a=+availOf(p).a[s.day*NB+s.band]||0;const pr=prefOf(p,s.course);return {p,a,pr,out:!!out[p],ok:a>0&&pr>0&&!out[p]}})}
/* Places qu'il faut encore trouver : celles qui peuvent venir et n'ont pas déjà réservé. */
function needOf(s,w){const bk=(week().booked||{})[s.id]||{};return w.filter(x=>x.ok&&!bk[x.p]).length}
function shortOf(s,w){const pl=placesOf(s.id),need=needOf(s,w);return pl!==null&&need>0&&pl<need}
function scoreSlot(s,prevPlan){
  if(booking(s).st==='past')return null;
  const w=who(s),att=w.filter(x=>x.ok);let sc=0;
  att.forEach(x=>{sc+=(x.a===2?1.35:1)*(x.pr===2?1.5:1)});
  if(att.length===3)sc+=2.5;
  const pl=placesOf(s.id),bkd=(week().booked||{})[s.id]||{},need=needOf(s,w),anyBk=att.some(x=>bkd[x.p]);
  if(pl===0&&need>0)return null;
  if(pl!==null&&pl<need)sc*=0.35;
  if(s.club!=='auteuil'&&lieuAt(s.day,s.band)!=='beaugrenelle')sc-=0.4; /* Auteuil de préférence */
  if(pl===null&&s.max&&s.max<=6)sc-=0.8; /* petite salle : trois places libres d'un coup sont peu probables */
  att.forEach(x=>{if(bkd[x.p])sc+=1.2}); /* place déjà prise (réinscription) */
  /* Sans coup de cœur ni place déjà prise, on évite de refaire le même cours que la semaine d'avant. */
  if(prevPlan&&!anyBk&&!att.some(x=>x.pr===2)&&Object.values(prevPlan).some(id=>{const p=slotById(id);return p&&p.course===s.course}))sc-=2;
  return {s,sc,n:att.length,w}}
function recommend(lock,me){
  const prevPlan=week(shiftWeek(ui.week,-1)).plan||null;
  const by={};CATS.forEach(([c])=>by[c]=[]);
    candidates().forEach(s=>{if(!s.cat)return;const r=scoreSlot(s,prevPlan);if(r&&r.n>=1)by[s.cat].push(r)});
  CATS.forEach(([c])=>{by[c].sort((a,b)=>b.sc-a.sc)});
  const top={},pins=week().pins||{},pinned={};
  CATS.forEach(([c])=>{const fid=(lock&&lock[c])||pins[c],ps=fid&&slotById(fid);let pr=ps&&scoreSlot(ps,prevPlan);
    if(ps&&!pr&&lock&&lock[c]){const w=who(ps);pr={s:ps,sc:0,n:w.filter(x=>x.ok).length,w}} /* déjà validé : on le garde quoi qu'il arrive */
    if(pr&&!(lock&&lock[c])&&pr.n===0)pr=null; /* cours choisi où plus personne n'est dispo : on ne l'impose plus */
    if(pr){pinned[c]=1;top[c]=[pr]}else top[c]=by[c].slice(0,36)});
  const gymDays=new Set(gymList().map(g=>g.day));
  const combos=[];
  for(const f of top.force)for(const c of top.cardio)for(const m of top.mobilite){
    let sc=f.sc+c.sc+m.sc;const ds=[f.s,c.s,m.s];let clash=false;
    for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){const a=ds[i],b=ds[j];
      if(a.day===b.day)clash=true; /* un seul cours par jour */
      else if(Math.abs(a.day-b.day)===1)sc-=3.5; /* de préférence un jour de pause entre deux séances */
      else sc+=0.4}
    if(clash)continue;
    ds.forEach(x=>{if(gymDays.has(x.day)&&!(lock&&lock[x.cat]))sc-=3}); /* pas de cours un jour de salle, si possible */
    combos.push({sc,pick:{force:f,cardio:c,mobilite:m}})}
  combos.sort((a,b)=>b.sc-a.sc);
  /* Diversité : chaque plan suivant évite les créneaux, les cours et les jours déjà proposés. */
  const plans=[],pool=combos.slice(0,6000);
  while(plans.length<3&&pool.length){
    let best=null,bestV=-1e9;
    for(const co of pool){let v=co.sc;
      for(const p of plans)for(const [c] of CATS){if(pinned[c])continue;const x=co.pick[c].s,y=p.pick[c].s;
        if(x.id===y.id)v-=100;else{if(x.course===y.course)v-=1.2;if(x.day===y.day)v-=1.5}}
      if(v>bestV){bestV=v;best=co}}
    if(!best||(plans.length&&bestV<-50))break;
    plans.push(best);pool.splice(pool.indexOf(best),1)}
  return {plans,by}}

/* ---------- Rendu ---------- */
const CATLBL={force:'Force',cardio:'Cardio',mobilite:'Mobilité'};
const TABS=[['semaine','Semaine'],['planning','Planning'],['dispos','Dispos'],['idees','Idées']];
const ICON={
  semaine:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M8 3v4M16 3v4M8.5 13.5l2.5 2.5 4.5-5"/></svg>',
  planning:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>',
  dispos:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  idees:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2h5c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg>'};
function courseTag(name){const st=STYLE[name];
  return st?`<span class="tag" style="--tb:${st[0]};--tf:${st[1]}">${esc(name)}</span>`:`<span class="tag outline">${esc(name)}</span>`}
function av(p,cls,txt){return `<span class="av ${cls}">${esc(txt==null?initial(p):txt)}</span>`}
function avs(w,booked){return `<span class="avs">`+w.map(x=>{const bk=booked&&booked[x.p];
  return `<span class="av ${bk?'bk':x.ok?'on':'off'}" title="${esc(pname(x.p))} : ${bk?'a réservé':x.ok?(x.solo?'y va':'peut venir'):x.solo?'n’y va pas':x.out?'pas de place pour elle':(x.pr===0?'ne veut pas ce cours':'pas dispo')}">${esc(initial(x.p))}</span>`}).join('')+`</span>`}
function placesTxt(s,w){const pl=placesOf(s.id),need=needOf(s,w);
  if(pl===null)return '';
  if(pl===0)return `<span class="pl ${need?'bad':''}">Complet</span>`;
  if(pl<need)return `<span class="pl bad">${pl} place${pl>1?'s':''} pour ${need}</span>`;
  return `<span class="pl ok">${pl>=3?'3 places ou plus':pl+' place'+(pl>1?'s':'')}</span>`}
function placesCtl(s){const pl=placesOf(s.id);const opt=[[null,'?'],[0,'Complet'],[1,'1'],[2,'2'],[3,'3+']];
  return `<span class="seg sm" role="group" aria-label="Places restantes">`+opt.map(([v,l])=>
    `<button data-act="places" data-id="${s.id}" data-v="${v===null?'':v}" aria-pressed="${pl===v}">${l}</button>`).join('')+`</span>`}
function whenTxt(s){return DAYS[s.day]+' '+hhmm(s.time)}
function absentTxt(w){const out=w.filter(x=>!x.ok);if(!out.length)return 'Toutes les trois';
  return 'Sans '+out.map(x=>pname(x.p)).join(' ni ')}
function bookShort(s){const b=booking(s);
  /* Le cours de la semaine d'avant a lieu aujourd'hui et n'est pas fini : les places seront visibles juste après. */
  if(b.st==='soon'&&!s.gym&&+keyDate(shiftWeek(ui.week,-1),s.day)===+today0()&&!isDone(shiftWeek(ui.week,-1),s)){const e=s.min+(s.dur||55);
    return `<span class="ss warn">Places à noter ${e>=1020?'ce soir':'aujourd’hui'} après ${Math.floor(e/60)}h${String(e%60).padStart(2,'0')}</span>`}
  return b.st==='open'?`<span class="ss ok">Inscriptions ouvertes</span>`:b.st==='soon'?`<span class="ss">Ouvre ${b.dOpen===1?'demain':esc(b.lbl)}</span>`:`<span class="ss">Passé</span>`}

/* Une semaine sur 7 colonnes : les séances posées sur leur jour, les jours de repos laissés vides. */
/* Catégories dont le cours imposé tombe sur cette case (jour + tranche). */
function cellPins(d,b){const pins=week().pins||{};return CATS.map(([c])=>c).filter(c=>{const x=pins[c]&&slotById(pins[c]);return x&&x.day===d&&x.band===b})}
/* Créneaux « à part » déjà retenus : week.solo[personne][catégorie] = id du créneau. */
function soloList(){const so=week().solo||{},out=[];PEOPLE.forEach(p=>CATS.forEach(([c])=>{const id=so[p]&&so[p][c],sl=id&&slotById(id);if(sl)out.push({p,c,s:sl})}));return out}
/* Meilleur créneau de la même catégorie pour une personne seule, un jour où elle n'a pas déjà une séance. */
/* Jours déjà pris pour une personne, hors catégorie donnée : cours du groupe où elle vient, créneaux à part, salle. */
function busyDays(p,cat,pick){return CATS.filter(([c])=>c!==cat&&pick[c]&&pick[c].w.some(x=>x.p===p&&x.ok)).map(([c])=>pick[c].s.day)
  .concat(soloList().filter(o=>o.p===p&&o.c!==cat).map(o=>o.s.day))
  .concat(gymList().filter(g=>gymWho(g).some(x=>x.p===p&&x.ok)).map(g=>g.day))}
/* Celles qui ne sont pas au cours du groupe de cette catégorie et n'ont pas encore retenu de créneau à part. */
function awayFrom(cat,pick){const so=week().solo||{};return pick[cat]?pick[cat].w.filter(x=>!x.ok&&!(so[x.p]&&so[x.p][cat])).map(x=>x.p):[]}
/* Créneaux à part pour une personne. On classe d'abord ceux où les autres absentes peuvent venir aussi
   (même calcul pour chacune, donc la même proposition), puis ceux déjà retenus par une autre. */
function soloOptions(p,cat,pick,n,extraBusy){
  const kept=new Set(soloList().filter(o=>o.p!==p&&o.c===cat).map(o=>o.s.id));
  const group=[p].concat(awayFrom(cat,pick).filter(q=>q!==p)),busy={};
  group.forEach(q=>busy[q]=busyDays(q,cat,pick).concat(q===p?(extraBusy||[]):[]));
  const val=(q,sl)=>{if(busy[q].includes(sl.day))return null;const x=who(sl).find(y=>y.p===q);if(!x.ok)return null;
    return (x.a===2?1.35:1)*(x.pr===2?1.5:1)-(busy[q].some(d=>Math.abs(d-sl.day)===1)?1:0)};
  const out=[];
  candidates().forEach(sl=>{if(sl.cat!==cat||booking(sl).st==='past'||placesOf(sl.id)===0)return;
    const mine=val(p,sl);if(mine===null)return;
    const vs=group.map(q=>val(q,sl)).filter(v=>v!==null);
    out.push({s:sl,k:vs.length+(kept.has(sl.id)?1:0),v:vs.reduce((a,b)=>a+b,0)-(sl.club!=='auteuil'?0.4:0),
      withs:group.filter(q=>q!==p&&val(q,sl)!==null)})});
  out.sort((a,b)=>b.k-a.k||b.v-a.v||a.s.day-b.s.day||a.s.min-b.s.min||a.s.course.localeCompare(b.s.course));
  const pickd=[];for(const o of out){if(pickd.some(q=>q.s.course===o.s.course&&q.s.day===o.s.day))continue;pickd.push(o);if(pickd.length>=(n||4))break}
  return pickd.map(o=>Object.assign({},o.s,{withs:o.withs}))}
function soloFor(p,cat,pick,extraBusy){return soloOptions(p,cat,pick,1,extraBusy)[0]||null}
function soloHints(c,r,pick,me){if(!pick||!CATLBL[c]||r.label)return '';const so=week().solo||{};
  return r.w.filter(x=>!x.ok&&(!me||x.p===me)&&!(so[x.p]&&so[x.p][c])).map(x=>{const a=soloFor(x.p,c,pick);
    return a?`<span class="ss solo">${esc(pname(x.p))} : ${DAYS[a.day].slice(0,3).toLowerCase()}. ${hhmm(a.time)} ${esc(a.course)}</span>`:''}).join('')}
/* week.invites[créneau] = {from:'p1', to:{p2:'ask'|'yes'|'no'}} */
function invitesFor(p){const iv=week().invites||{};return Object.keys(iv).filter(id=>iv[id]&&iv[id].to&&iv[id].to[p]==='ask'&&slotById(id)&&!isDone(ui.week,slotById(id))).map(id=>({s:slotById(id),from:iv[id].from}))}
function inviteRows(p){return invitesFor(p).map(o=>`<div class="rb"><span class="aw"><span class="lbl">${esc(pname(o.from))} t’invite</span><b>${DAYS[o.s.day].slice(0,3)}. ${hhmm(o.s.time)}</b>${courseTag(o.s.course)}${o.s.club!=='auteuil'?'<span class="lbl">Beaugrenelle</span>':''}</span>
    <span class="rbp"><button class="btn sm" data-act="invyes" data-id="${o.s.id}" data-p="${p}">J’y vais</button><button class="btn ghost sm" data-act="invno" data-id="${o.s.id}" data-p="${p}">Non merci</button></span></div>`).join('')}
function isPinned(s){return s.cat&&(week().pins||{})[s.cat]===s.id}
function sessionCard(c,r,opts){const s=r.s,bk=(week().booked||{})[s.id]||null,done=opts.booked&&isDone(ui.week,s);
  if(r.suggest)return `<button class="sess sug c-${c}" data-act="solo" data-p="${opts.me}" data-cat="${c}" data-id="${s.id}">
    <span class="sc">${CATLBL[c]}</span><span class="st">${hhmm(s.time)}</span><span class="sn">${courseTag(s.course)}</span>
    <span class="smeta">${esc(s.coach.split(' · ')[0])}${s.dur?' · '+s.dur+' min':''}${s.club!=='auteuil'?' · Beaugrenelle':''}</span>
    <span class="keep">Retenir</span><span class="ss">${r.w.length?'Avec '+esc(r.w.map(x=>pname(x.p)).join(' et ')):r.also&&r.also.length?'Proposé aussi à '+esc(r.also.map(pname).join(' et ')):'Proposé à la place du cours du groupe'}</span></button>`;
  return `<button class="sess c-${c} ${opts.booked&&!r.away&&shortOf(s,r.w)?'pb':''} ${r.away?'away':''}" data-act="slot" data-id="${s.id}">
    <span class="sc">${esc(r.label||CATLBL[c]||'Salle')}</span><span class="st">${hhmm(s.time)}</span><span class="sn">${courseTag(s.course)}</span>
    <span class="smeta">${esc(s.coach.split(' · ')[0])}${s.dur?' · '+s.dur+' min':''}</span>
    ${avs(r.w,bk)}${done?'<span class="ss warn">Fait · réinscrites ?</span>':bookShort(s)}${placesTxt(s,r.w)}${s.club!=='auteuil'?'<span class="ss">À Beaugrenelle</span>':''}${isPinned(s)?'<span class="ss">Cours choisi</span>':''}${r.away?'<span class="ss">Sans toi</span>':''}</button>`}
function strip(pick,opts){const byDay={},add=(d,c,r)=>(byDay[d]=byDay[d]||[]).push([c,r]);
  const me=opts&&opts.me,mine=w=>!me||w.some(x=>x.p===me&&x.ok),so=week().solo||{};
  const sugDays=[];
  CATS.forEach(([c])=>{const r=pick[c];if(!r)return;
    if(me&&opts.booked&&!mine(r.w)){
      if(!(so[me]&&so[me][c])){const a=soloFor(me,c,pick,sugDays);  /* ma proposition à la place du cours du groupe */
        if(a){sugDays.push(a.day);add(a.day,c,{s:a,w:soloList().filter(o=>o.s.id===a.id&&o.p!==me).map(o=>({p:o.p,ok:true,a:1,pr:1})),n:1,suggest:true,also:a.withs||[]})}}
      return}
    add(r.s.day,c,r)});
  ((opts&&opts.gyms)||[]).forEach(g=>{const w=gymWho(g);if(mine(w))add(g.day,'x',{s:g,w,n:w.filter(x=>x.ok).length})});
  const grp={};((opts&&opts.solos)||[]).forEach(o=>{const k=o.c+'|'+o.s.id;(grp[k]=grp[k]||{c:o.c,s:o.s,ps:[]}).ps.push(o.p)});
  Object.values(grp).forEach(g=>{if(me&&!g.ps.includes(me))return;
    add(g.s.day,g.c,{s:g.s,w:PEOPLE.map(p=>({p,a:1,pr:1,ok:g.ps.includes(p),solo:true})),n:g.ps.length,label:g.ps.map(pname).join(' + ')+' · '+CATLBL[g.c]})});
  opts=Object.assign({pick},opts||{});
  let h=`<div class="week7">`;
  for(let d=0;d<7;d++){const e=(byDay[d]||[]).sort((x,y)=>x[1].s.min-y[1].s.min);
    h+=`<div class="day ${e.length?'has':'rest'}"><div class="dh"><b>${DAYS[d].slice(0,3)}</b>${keyDate(ui.week,d).getDate()}</div>${e.length?`<div class="cards">${e.map(x=>sessionCard(x[0],x[1],opts||{})).join('')}</div>`:''}</div>`}
  return h+`</div>`}

function confirmBanner(){const c=confirmInfo(),miss=PEOPLE.filter(p=>!c.conf[p]);
  const who=`<span class="avs">${PEOPLE.map(p=>av(p,c.conf[p]?'bk':'ko',c.conf[p]?'✓':null)).join('')}</span>`;
  if(c.all)return `<div class="confirm ok">${who}<div class="ct"><b>Dispos validées par toutes les trois</b><span>Vous pouvez retenir un plan.</span></div></div>`;
  const names=esc(miss.map(pname).join(miss.length===2?' et ':', '));
  /* Moi, c'est fait : bandeau vert, seules les pastilles de celles qui manquent restent rouges. */
  if(ui.me&&c.conf[ui.me])return `<div class="confirm ok">${who}<div class="ct"><b>Tes dispos sont validées</b><span>Il manque ${names}</span></div></div>`;
  const when=c.left>1?`Avant ${esc(longDate(c.deadline)).replace(/\.$/,'')} soir`:c.left===1?'Avant demain soir':c.left===0?'Ce soir au plus tard':'Inscriptions déjà ouvertes';
  return `<div class="confirm ko">${who}<div class="ct"><b>Dispos à valider</b><span>${when} · il manque ${names}</span></div>
    <button class="btn sm" data-act="tab" data-v="dispos">Valider les miennes</button></div>`}

/* Après un cours terminé : chacune dit si elle s'est réinscrite au même créneau la semaine suivante.
   Une réinscription est une réservation de la semaine cible ; tant qu'elle n'est pas dans le plan, c'est une sécurité. */
function isDone(weekKey,s){const d=keyDate(weekKey,s.day),t=today0();if(d<t)return true;if(d>t)return false;
  const n=new Date();return n.getHours()*60+n.getMinutes()>=s.min+(s.dur||55)}
function rebookRows(srcWeek){const target=shiftWeek(srcWeek,1),plan=week(srcWeek).plan||{},tw=week(target);
  const done=catsByWeek(c=>plan[c]&&slotById(plan[c])).map(([c])=>plan[c]&&slotById(plan[c])).filter(s=>s&&isDone(srcWeek,s));
  if(!done.length)return '';
  return done.map(s=>`<div class="rb"><span class="aw"><b>${DAYS[s.day].slice(0,3)}. ${hhmm(s.time)}</b>${courseTag(s.course)}</span>
    <span class="rbp">${PEOPLE.map(p=>{const y=!!(((tw.booked||{})[s.id]||{})[p]),n=!!(((tw.rebookNo||{})[s.id]||{})[p]);
      return `<span class="rb1">${av(p,y?'bk':n?'off':'on')}<span class="seg sm" role="group" aria-label="${esc(pname(p))} réinscrite"><button data-act="rebook" data-w="${target}" data-id="${s.id}" data-p="${p}" data-v="1" aria-pressed="${y}">Oui</button><button data-act="rebook" data-w="${target}" data-id="${s.id}" data-p="${p}" data-v="0" aria-pressed="${n}">Non</button></span></span>`}).join('')}${target===ui.week?`<span class="rb1"><span class="lbl">Places restantes</span>${placesCtl(s)}</span>`:''}</span></div>`).join('')}
function offPlanRows(){const wk=week(),plan=wk.plan||{},inPlan=new Set(Object.values(plan));
  const solo=new Set(soloList().map(o=>o.s.id));
  return Object.keys(wk.booked||{}).filter(id=>!id.startsWith('gym_')&&!solo.has(id)&&!inPlan.has(id)&&slotById(id)&&PEOPLE.some(p=>wk.booked[id][p]))
    .map(slotById).sort((a,b)=>a.day-b.day||a.min-b.min).map(s=>{const w=who(s);
      return `<button class="alt" data-act="slot" data-id="${s.id}"><span class="aw"><b>${DAYS[s.day].slice(0,3)}. ${hhmm(s.time)}</b>${courseTag(s.course)}</span>${avs(w.filter(x=>wk.booked[s.id][x.p]),wk.booked[s.id])}</button>`}).join('')}

/* Ce qui est déjà validé cette semaine ; s'il manque des catégories, elles sont à compléter (lock). */
function planState(){const p=week().plan||{},pick={};
  CATS.forEach(([c])=>{const sl=p[c]&&slotById(p[c]);if(sl){const w=who(sl);pick[c]={s:sl,w,n:w.filter(x=>x.ok).length}}});
  const have=CATS.filter(([c])=>pick[c]),miss=CATS.filter(([c])=>!pick[c]),lock={};have.forEach(([c])=>lock[c]=pick[c].s.id);
  return {pick,have,miss,lock:have.length&&miss.length?lock:null}}
/* Bouton à confirmer : premier clic « armé », second clic = action. Tout autre clic le désarme. */
/* La personne visée par « Réinitialiser le planning » : celle dont on regarde les dispos, sinon celle sélectionnée. */
function resetWho(){return ui.tab==='dispos'?ui.edit:(ui.me||ui.edit)}
function armBtn(key,label,dis){const on=ui.arm===key;
  return `<button class="btn sm ${on?'danger':'ghost'}" data-act="arm" data-v="${key}" ${dis||''}>${on?'Confirmer : tout effacer':label}</button>`}
function renderSemaine(){
  const st=planState(),{plans}=recommend(st.lock,ui.me),wk=week(),gyms=gymList();
  let h=Store.ready?confirmBanner():'';
  const inv=ui.me?inviteRows(ui.me):'';
  if(inv)h+=`<div class="rbs invite">${inv}</div>`;
  const rb=rebookRows(shiftWeek(ui.week,-1));
  if(rb)h+=`<section class="blk"><div class="hd"><h2>Réinscrites pour cette semaine ?</h2></div><div class="rbs">${rb}</div></section>`;
  const total=st.have.length*3,done=st.have.reduce((n,[c])=>n+Object.values(((wk.booked||{})[st.pick[c].s.id])||{}).filter(Boolean).length,0);
  h+=`<section class="blk"><div class="hd"><h2>Notre semaine</h2>
      <button class="btn ghost sm" data-act="gymadd">Ajouter une séance de salle</button></div>
    ${(f=>f?`<div class="rbs todo">${f}</div>`:'')(checkRows(st.pick))}
    ${(f=>f?`<div class="rbs fix">${f}</div>`:'')(fixRows(st.pick))}
    ${total||gyms.length||soloList().length?strip(st.pick,{booked:true,gyms,solos:soloList(),me:ui.me}):`<p class="none">Rien de validé pour l’instant.</p>`}
    ${total?`<div class="ft"><span>${esc(nextDeadline(wk.plan||{},wk))}</span></div>`:''}</section>`;
  const off=offPlanRows();
  if(off)h+=`<section class="blk"><div class="hd"><h2>Réservations de sécurité</h2><span class="sub">Hors plan : à garder ou à annuler dans l’appli</span></div><div class="alts">${off}</div></section>`;
  const shown=st.lock?st.miss:CATS;
  h+=`<section class="blk"><div class="hd"><h2>${st.lock?'Pour compléter':st.have.length===3?'Autres propositions':'Propositions'}</h2></div>`;
  if(!plans.length)h+=`<p class="none">Aucune combinaison possible avec un cours par catégorie. Élargissez vos dispos ou retirez un « Non ».</p>`;
  else h+=plans.map((pl,i)=>{const n3=shown.filter(([c])=>pl.pick[c].n===3).length,sub={};shown.forEach(([c])=>sub[c]=pl.pick[c]);
      const dd=CATS.map(([c])=>pl.pick[c].s.day).sort((a,b)=>a-b),tight=dd.some((x,k)=>k&&x-dd[k-1]===1);
      return `<article class="prop"><div class="ph"><span class="letter">${'ABC'[i]}</span>
        <span class="psub">${n3===shown.length?'Toutes les trois':n3?n3+' cours sur '+shown.length+' à trois':'Aucun cours à trois'}${tight?' · deux jours de suite':''}</span>
        <button class="btn sm" data-act="choose" data-i="${i}">${st.lock?'Ajouter':'Choisir'}</button></div>${strip(sub,{me:ui.me})}</article>`}).join('');
  return h+`</section>`}
function catsByWeek(get){return CATS.slice().sort((a,b)=>{const x=get(a[0]),y=get(b[0]);
  if(!x||!y)return (x?0:1)-(y?0:1);return x.day-y.day||x.min-y.min})}
function nextDeadline(chosen,wk){
  const todo=CATS.map(([c])=>chosen[c]&&slotById(chosen[c])).filter(Boolean).filter(s=>PEOPLE.some(p=>!(((wk.booked||{})[s.id]||{})[p])))
    .map(s=>({s,b:booking(s)})).filter(x=>x.b.st!=='past').sort((a,b)=>a.b.open-b.b.open);
  if(!todo.length)return 'Tout est réservé pour cette semaine.';
  const now=todo.filter(x=>x.b.st==='open');
  if(now.length)return 'À réserver maintenant : '+now.map(x=>x.s.course+' de '+DAYS[x.s.day].toLowerCase()).join(', ')+'.';
  return 'Prochaine ouverture '+todo[0].b.lbl.replace(/\.$/,'')+' : '+todo[0].s.course+' de '+DAYS[todo[0].s.day].toLowerCase()+'.'}
function dayTaken(cat,day){const plan=week().plan||{};
  return CATS.some(([c])=>c!==cat&&plan[c]&&slotById(plan[c])&&slotById(plan[c]).day===day)}
function bestAlts(cat,cur,n){const plan=week().plan||{};
  const days=CATS.filter(([c])=>c!==cat&&plan[c]&&slotById(plan[c])).map(([c])=>slotById(plan[c]).day);
  const tight=d=>days.some(x=>Math.abs(x-d)===1)?1:0;
  return recommend().by[cat].filter(a=>a.s.id!==cur&&!dayTaken(cat,a.s.day)&&!shortOf(a.s,a.w)).sort((a,b)=>tight(a.s.day)-tight(b.s.day)||b.sc-a.sc).slice(0,n||5)}
function altList(cat,cur,n){const alts=bestAlts(cat,cur,n);

function checkRows(pick){return catsByWeek(c=>pick[c]&&pick[c].s).filter(([c])=>{const r=pick[c];
    return r&&placesOf(r.s.id)===null&&needOf(r.s,r.w)>0&&isDone(shiftWeek(ui.week,-1),r.s)&&!isDone(ui.week,r.s)})
  .map(([c])=>{const sl=pick[c].s,b=booking(sl);
    return `<div class="rb"><span class="aw"><b>${DAYS[sl.day].slice(0,3)}. ${hhmm(sl.time)}</b>${courseTag(sl.course)}<span class="lbl">${b.st==='open'?'inscriptions ouvertes':'ouvre '+(b.dOpen===1?'demain':esc(b.lbl))}</span></span>

/* Pas assez de places : soit certaines laissent la leur (et reçoivent un créneau à part), soit tout le groupe change de cours. */
function fixRows(pick){return catsByWeek(c=>pick[c]&&pick[c].s).filter(([c])=>pick[c]&&(pick[c].n===0||shortOf(pick[c].s,pick[c].w))&&!isDone(ui.week,pick[c].s)).map(([c])=>{

      <span class="rbp">${a?`<span class="aw"><span class="lbl">Remplacer par</span><b>${DAYS[a.s.day].slice(0,3)}. ${hhmm(a.s.time)}</b>${courseTag(a.s.course)}</span><button class="btn sm" data-act="setplan" data-cat="${c}" data-id="${a.s.id}">Remplacer</button>`:''}
      <button class="btn ghost sm" data-act="unplan" data-v="${c}">Retirer</button></span></div>`}
  const r=pick[c],sl=r.s,pl=placesOf(sl.id),bk=(week().booked||{})[sl.id]||{},wait=r.w.filter(x=>x.ok&&!bk[x.p]),anyBk=r.w.some(x=>x.ok&&bk[x.p]),a=bestAlts(c,sl.id,1)[0];
  const names=esc(wait.map(x=>pname(x.p)).join(wait.length===2?' et ':', '));
  let act='';
  if(pl>0)act+=`<span class="aw"><span class="lbl">Qui laisse sa place ?</span>${wait.map(x=>`<button class="btn ghost sm" data-act="out" data-id="${sl.id}" data-p="${x.p}">${esc(pname(x.p))}</button>`).join('')}</span>`;
  else if(anyBk)act+=`<button class="btn sm" data-act="outall" data-id="${sl.id}">Créneau à part pour ${names}</button>`;
  if(!anyBk&&a)act+=`<span class="aw"><span class="lbl">${pl>0?'ou toutes sur':'Toutes sur'}</span><b>${DAYS[a.s.day].slice(0,3)}. ${hhmm(a.s.time)}</b>${courseTag(a.s.course)}</span><button class="btn sm" data-act="setplan" data-cat="${c}" data-id="${a.s.id}">Remplacer</button>`;

function closeDlg(){dlgSlot=null;dlgCat=null;dlgPick=null;dlgGym=null;const d=document.getElementById('dlg');if(d.open)d.close()}
document.getElementById('dlg').addEventListener('close',()=>{dlgSlot=null;dlgCat=null;dlgPick=null;dlgGym=null});
document.getElementById('dlg').addEventListener('click',e=>{if(e.target&&e.target.id==='dlg')closeDlg()});

let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3800)}
function save(path,patch){if(!Store.write(path,patch))toast(Store.readonly?'Lecture seule : rien n’a été modifié.':'Encore un instant, les données se chargent.')}
function saveAvail(p,a,m){
  if(ui.scope==='week')save(weekPath(),{avail:{[p]:{a,m}}});
  else save('profiles/'+p,{avail:a,modes:m})}

document.addEventListener('click',e=>{
  if(lpDone){lpDone=false;return}
  {const b=e.target.closest('[data-act="arm"]');
    if(b&&b.dataset.act==='arm'){const k=b.dataset.v;
      if(k==='type'){ui.menu=false;ui.arm=null;ui.scope=ui.scope==='type'?'week':'type';render();return}
      if(k==='link'){ui.menu=false;ui.arm=null;const L=Store.link;
        (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(L):Promise.reject()).then(()=>toast('Lien copié. Envoie-le à Coco et Clem.'),()=>toast('Copie impossible : copie l’adresse de la page à la main.'));renderTop();return}
      if(ui.arm!==k){ui.arm=k;render();return}
      ui.arm=null;ui.menu=false;
      if(k==='week'){save(weekPath(),{plan:null,solo:null,out:null,places:null,booked:null,gym:null,pins:null,lieu:null,rebookNo:null,invites:null});toast('Semaine du '+dayLabel(ui.week,0)+' réinitialisée.')}
      else if(k==='mine'){const p=resetWho();save('profiles/'+p,{avail:null,modes:null,prefs:null});save(weekPath(),{avail:{[p]:null},confirmed:{[p]:null}});toast('Dispos de '+pname(p)+' réinitialisées.')}
      render();return}
    if(ui.arm){ui.arm=null}
    const mb=e.target.closest('[data-act="menu"]');
    if(mb&&mb.dataset.act==='menu'){ui.menu=!ui.menu;renderTop();return}
    if(ui.menu){ui.menu=false;renderTop()}}
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;
  const a=el.dataset.act,v=el.dataset.v;
  if(a==='tab'){ui.tab=v;ui.menu=false;ui.scope='week';try{history.replaceState(null,'','#'+v)}catch(x){try{location.hash=v}catch(y){}}}
  else if(a==='club'){save('group/settings',{club:v});ui.swap=null}
  else if(a==='week'){ui.scope='week';ui.week=shiftWeek(ui.week,+v);ui.swap=null}
  else if(a==='me'){if(ui.me===v&&ui.tab!=='dispos'){ui.me=null;try{localStorage.removeItem('fds:me')}catch(x){}}else{ui.me=v;ui.edit=v;try{localStorage.setItem('fds:me',v)}catch(x){}}}
  else if(a==='edit'){ui.edit=v}
  else if(a==='cat'){ui.cat=v}
  else if(a==='day'){ui.day=+v}
  else if(a==='scope'){ui.scope=v}
  else if(a==='swap'){ui.swap=ui.swap===v?null:v}
  else if(a==='showall'){ui.showAll=true}
  else if(a==='slot'){dlgSlot=el.dataset.id;dlgCat=null;openDlg();return}
  else if(a==='pin'){const sl=slotById(el.dataset.id),patch={pins:{[sl.cat]:sl.id}};if(week().plan)patch.plan={[sl.cat]:sl.id};
    save(weekPath(),patch);closeDlg();ui.tab='semaine';toast(sl.course+' de '+DAYS[sl.day].toLowerCase()+' choisi pour la semaine du '+dayLabel(ui.week,0)+'.')}
  else if(a==='place'){save(weekPath(),{lieu:{[el.dataset.d+'-'+el.dataset.b]:v||null}})}
  else if(a==='resetcell'){const d=+el.dataset.d,b=+el.dataset.b,patch={lieu:{[d+'-'+b]:null},pins:{}};cellPins(d,b).forEach(c=>patch.pins[c]=null);
    save(weekPath(),patch);closeDlg();toast('Créneau réinitialisé.')}
  else if(a==='unpin'){save(weekPath(),{pins:{[v]:null}});closeDlg()}
  else if(a==='solo'){const d=el.dataset;save(weekPath(),{solo:{[d.p]:{[d.cat]:d.id}}});if(dlgSlot)closeDlg();toast('Créneau retenu pour '+pname(d.p)+'. Touche-le pour l’annuler.')}
  else if(a==='unsolo'){const d=el.dataset;save(weekPath(),{solo:{[d.p]:{[d.cat]:null}}});if(dlgSlot&&!(week().plan&&Object.values(week().plan).includes(dlgSlot)))closeDlg()}
  else if(a==='out'){const d=el.dataset;save(weekPath(),{out:{[d.id]:{[d.p]:true}}});toast(pname(d.p)+' laisse sa place : un créneau à part lui est proposé.')}
  else if(a==='outall'){const id=el.dataset.id,sl=slotById(id),bk=(week().booked||{})[id]||{},o={};who(sl).forEach(x=>{if(x.ok&&!bk[x.p])o[x.p]=true});save(weekPath(),{out:{[id]:o}})}
  else if(a==='in'){const d=el.dataset;save(weekPath(),{out:{[d.id]:{[d.p]:null}}})}
  else if(a==='invite'){const d=el.dataset,cur=((week().invites||{})[d.id]||{}).to||{};
    save(weekPath(),{invites:{[d.id]:{from:ui.me,to:{[d.p]:cur[d.p]==='ask'?null:'ask'}}}});if(cur[d.p]!=='ask')toast(pname(d.p)+' est invitée : elle le verra en ouvrant la page.')}
  else if(a==='invyes'){const d=el.dataset,sl=slotById(d.id),patch={invites:{[d.id]:{to:{[d.p]:'yes'}}}};
    if(sl.gym){const key=sl.id.slice(4),cur=gymPart(key)||{},o={};PEOPLE.forEach(q=>o[q]=q===d.p?true:!!cur[q]);patch.gym={[key]:o}}
    else if((week().plan||{})[sl.cat]===sl.id)patch.out={[sl.id]:{[d.p]:null}};else patch.solo={[d.p]:{[sl.cat]:sl.id}};
    save(weekPath(),patch);toast('C’est noté : '+sl.course+' de '+DAYS[sl.day].toLowerCase()+'.')}
  else if(a==='invno'){const d=el.dataset;save(weekPath(),{invites:{[d.id]:{to:{[d.p]:'no'}}}})}
  else if(a==='gymadd'){const wh={};PEOPLE.forEach(p=>wh[p]=ui.me?p===ui.me:true);dlgGym={d:0,t:'18:30',who:wh};dlgSlot=null;dlgCat=null;dlgPick=null;openDlg();return}
  else if(a==='gymday'){if(dlgGym)dlgGym.d=+v;renderDlg();return}
  else if(a==='gymtime'){if(dlgGym)dlgGym.t=v;renderDlg();return}
  else if(a==='gympers'){if(dlgGym)dlgGym.who[v]=!dlgGym.who[v];renderDlg();return}
  else if(a==='gymsave'){const g=dlgGym;if(g&&PEOPLE.some(p=>g.who[p])){const key=g.d+'-'+g.t.replace(':',''),cur=gymPart(key)||{},o={};PEOPLE.forEach(p=>o[p]=!!(cur[p]||g.who[p]));
    save(weekPath(),{gym:{[key]:o}});closeDlg();toast('Séance de salle ajoutée.')}}
  else if(a==='gymwho'){const id=el.dataset.id,key=id.slice(4),p=el.dataset.p,cur=gymPart(key)||{},o={};PEOPLE.forEach(q=>o[q]=q===p?!cur[q]:!!cur[q]);
    if(PEOPLE.some(q=>o[q])){const patch={gym:{[key]:o}};if(!o[p])patch.booked={[id]:{[p]:null}};save(weekPath(),patch)}
    else{save(weekPath(),{gym:{[key]:null},booked:{[id]:null}});closeDlg()}}
  else if(a==='gymdel'){const id=el.dataset.id;save(weekPath(),{gym:{[id.slice(4)]:null},booked:{[id]:null}});closeDlg()}
  else if(a==='pickcat'){dlgCat=v;dlgSlot=null;openDlg();return}
  else if(a==='unplan'){save(weekPath(),{plan:{[v]:null},pins:{[v]:null}});closeDlg()}
  else if(a==='rebook'){const d=el.dataset,yes=d.v==='1',on=el.getAttribute&&el.getAttribute('aria-pressed')==='true';
    save(weekPath(d.w),{booked:{[d.id]:{[d.p]:yes&&!on?true:null}},rebookNo:{[d.id]:{[d.p]:!yes&&!on?true:null}}})}
  else if(a==='closedlg'){closeDlg();return}
  else if(a==='places'){save(weekPath(),{places:{[el.dataset.id]:v===''?null:+v}})}
  else if(a==='book'){const cur=((week().booked||{})[el.dataset.id]||{})[el.dataset.p];save(weekPath(),{booked:{[el.dataset.id]:{[el.dataset.p]:cur?null:true}}})}
  else if(a==='choose'){const pl=recommend(planState().lock,ui.me).plans[+el.dataset.i];if(pl){const plan={};CATS.forEach(([c])=>plan[c]=pl.pick[c].s.id);save(weekPath(),{plan});ui.showAll=false;toast('Plan retenu.')}}
  else if(a==='setplan'&&dayTaken(el.dataset.cat,slotById(el.dataset.id).day)){toast('Vous avez déjà un cours ce jour-là : un seul cours par jour.');return}
  else if(a==='setplan'){save(weekPath(),{plan:{[el.dataset.cat]:el.dataset.id}});if(dlgSlot||dlgCat){closeDlg();toast('Ajouté à votre semaine.')}}
  else if(a==='clearplan'){save(weekPath(),{plan:null,solo:null,out:null});ui.swap=null}
  else if(a==='confirm'){const cur=(week().confirmed||{})[ui.edit];save(weekPath(),{confirmed:{[ui.edit]:cur?null:true}});if(!cur)toast('Dispos validées.')}
  else if(a==='resetweek'){save(weekPath(),{avail:{[ui.edit]:null}})}
  else if(a==='cell'){const p=ui.edit,av=editAvail(p),i=+el.dataset.d*NB+ +el.dataset.b;const nv=((+av.a[i]||0)+1)%3;
    saveAvail(p,av.a.slice(0,i)+nv+av.a.slice(i+1),av.m)}
  else if(a==='pref'){const p=ui.edit;save('profiles/'+p,{prefs:{[el.dataset.c]:+v}})}
  else return;
  render()});
/* Clic droit (ordinateur) ou appui long (téléphone) sur une case : choisir un cours précis à cette heure. */
let lpT=null,lpDone=false;
function pickFrom(el){dlgPick={d:+el.dataset.d,b:+el.dataset.b};dlgSlot=null;dlgCat=null;openDlg()}
document.addEventListener('contextmenu',e=>{const el=e.target.closest&&e.target.closest('.cell');if(!el)return;e.preventDefault();pickFrom(el)});
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('.cell');if(!el||e.pointerType==='mouse')return;
  lpDone=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpDone=true;pickFrom(el)},550)});
['pointerup','pointercancel','pointermove'].forEach(t=>document.addEventListener(t,e=>{if(t!=='pointermove'||Math.abs(e.movementX)+Math.abs(e.movementY)>6)clearTimeout(lpT)}));
document.addEventListener('change',e=>{const el=e.target;const a=el.dataset&&el.dataset.act;
  if(a==='mode'){const p=ui.edit,av=editAvail(p),d=+el.dataset.d,k=el.value;
    saveAvail(p,av.a.slice(0,d*NB)+PRESET[k]+av.a.slice((d+1)*NB),av.m.slice(0,d)+k+av.m.slice(d+1));render()}
  else if(a==='together'){ui.together=el.checked;render()}
});
function fromHash(){try{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))ui.tab=h}catch(e){}}
fromHash();
try{window.addEventListener('hashchange',()=>{fromHash();render()})}catch(e){}
render();
Store.init(render);
</script>

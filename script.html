<script>
const DATA=/*__DATA__*/{"auteuil":[],"beaugrenelle":[]}/*__ENDDATA__*/;
const CATALOG=/*__CAT__*/{}/*__ENDCAT__*/;
/* Hors de claude.ai (Vercel) : identifiants publics du projet Firebase, injectés par build.py depuis firebase-config.json. */
/* Plannings relevés sur la page du club, semaine par semaine ; sinon c'est le planning du PDF (DATA). */
const WEEKDATA=/*__WK__*/{}/*__ENDWK__*/;
/* Date du relevé de chaque semaine. */
const WEEKMETA=/*__WM__*/{}/*__ENDWM__*/;
const FIREBASE_CONFIG=/*__FB__*/null/*__ENDFB__*/;

/* ---------- Référentiels ---------- */
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DAYKEYS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const CATS=[['force','Force'],['cardio','Cardio'],['mobilite','Mobilité']];
/* Semaines (lundi, AAAA-MM-JJ) dont le planning a été mis à jour depuis la page du club. */
/* Semaines dont le relevé est assez récent (fait dans les 8 jours avant le lundi) : pas besoin de le redemander. */
const PLANNING_WEEKS=Object.keys(WEEKDATA).filter(w=>WEEKMETA[w]&&keyDate(WEEKMETA[w])>=keyDate(w,-8));
const BOOK_AHEAD=6; /* inscriptions ouvertes 6 jours avant le cours */
const CAT_OF={'SKILL':'force','WOD':'force','TRX FORCE':'force','TRX BENCH':'force','CORE':'force','HYROX':'force',
  'RPM':'cardio','SPRINT':'cardio','BOXING BAG':'cardio','TRX CROSS':'cardio','STRENGTH':'cardio','CEREMONY':'cardio',
  'BODY BALANCE':'mobilite','REFORMER':'mobilite','TRX MOBILITÉ':'mobilite','PILATES':'mobilite','YOGA':'mobilite','GYM BASIC':'mobilite'};
const STYLE={'SKILL':['#5b2d82','#fff'],'WOD':['#d9582f','#1a0a04'],'TRX FORCE':['#fbe34a','#151514'],'TRX BENCH':['#fbe34a','#151514'],
  'TRX CROSS':['#fbe34a','#151514'],'TRX MOBILITÉ':['#fbe34a','#151514'],'CORE':['#cf6a33','#1a0a04'],'RPM':['#2c7bb8','#fff'],
  'SPRINT':['#2b2f63','#fff'],'BOXING BAG':['#a82e2e','#fff'],'BODY BALANCE':['#b3c77e','#151514'],'REFORMER':['#9bbde3','#151514'],
  'PILATES':['#9bbde3','#151514'],'YOGA':['#9bbde3','#151514'],'GYM BASIC':['#b4c3ea','#151514']};
const BANDS=['7h00','8h15','9h30 – 10h45','12h00 – 13h15','14h45 – 16h00','17h15','18h30','19h45','21h00'];
const NB=BANDS.length;
function bandOf(min){return min<480?0:min<540?1:min<720?2:min<840?3:min<1020?4:min<1080?5:min<1170?6:min<1230?7:8}
const MODES={B:'Bureau',T:'TT',L:'Libre',X:'Indispo'};
/* 17h15 compte comme la soirée : dispo les jours de bureau et de télétravail. */
const OLD_PRESET={B:'000100221',T:'110200221'};
/* Un jour resté sur l'ancien réglage par défaut suit le nouveau ; un jour modifié à la main n'est pas touché. */
function normAvail(a,m){let r='';for(let d=0;d<7;d++){const c=a.slice(d*NB,d*NB+NB);r+=OLD_PRESET[m[d]]===c?PRESET[m[d]]:c}return r}
const PRESET={B:'000101221',T:'110201221',L:'112111111',X:'000000000'};
const DEFAULT_MODES='BBBBBLL';
const DEFAULT_AVAIL=DEFAULT_MODES.split('').map(m=>PRESET[m]).join('');
const PEOPLE=['p1','p2','p3'];
const CLUBS={auteuil:'Auteuil',beaugrenelle:'Beaugrenelle',inconnu:'Club à voir sur l’appli FDS'};
/* Mention du lieu quand ce n'est pas Auteuil. */
/* Le lieu, toujours affiché dans les listes pour que toutes les lignes se lisent pareil. */
const clubNote=s=>s.gym?'':s.club==='beaugrenelle'?'Beaugrenelle':s.club==='inconnu'?'Club à voir':'Auteuil';

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
function applyPatch(t,p){for(const k in p){const v=p[k];if(v===null)delete t[k];else if(isObj(v))t[k]=applyPatch(isObj(t[k])?t[k]:{},v);else t[k]=v}return t}
function mergePatch(t,p){for(const k in p){const v=p[k];if(isObj(v))t[k]=mergePatch(isObj(t[k])?t[k]:{},v);else t[k]=v}return t}
function stripNulls(o){const r={};for(const k in o){const v=o[k];if(v===null)continue;r[k]=isObj(v)?stripNulls(v):v}return r}

/* ---------- Dates ---------- */
function mondayKey(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return fmtKey(x)}
function fmtKey(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function keyDate(k,add){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d+(add||0))}
function shiftWeek(k,n){return fmtKey(keyDate(k,7*n))}
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function dayLabel(k,i){const d=keyDate(k,i);return d.getDate()+' '+MONTHS[d.getMonth()]}
function defaultWeek(){const now=new Date();const k=mondayKey(now);return ((now.getDay()+6)%7)>=2?shiftWeek(k,1):k} /* dès mercredi, les inscriptions de la semaine suivante sont déjà ouvertes */

/* ---------- Stockage (base partagée de l'artifact, sinon cet appareil) ---------- */
const Store=(()=>{
  const docs={},pend={},inflight={},timers={};
  let db=null,mode='pending',loaded={},stale=false,dead=false,onChange=()=>{};
  const COLLS=['profiles','group','weeks'];
  const ls={get(k){try{const v=localStorage.getItem('fds:'+k);return v?JSON.parse(v):null}catch(e){return null}},
            set(k,v){try{localStorage.setItem('fds:'+k,JSON.stringify(v))}catch(e){}}};
  function get(path){let d=clone(docs[path])||{};if(inflight[path])applyPatch(d,inflight[path]);if(pend[path])applyPatch(d,pend[path]);return d}
  function exists(path){return docs[path]!=null}
  function write(path,patch){
    if(mode==='pending'||dead)return false;
    pend[path]=mergePatch(pend[path]||{},clone(patch));onChange();
    clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),mode==='local'?0:450);return true}
  function flush(path){
    if(!pend[path])return;
    if(mode==='local'){const d=applyPatch(clone(docs[path])||{},pend[path]);delete pend[path];docs[path]=d;
      const all=ls.get('docs')||{};all[path]=d;ls.set('docs',all);onChange();return}
    if(inflight[path])return;
    const patch=pend[path];delete pend[path];inflight[path]=patch;
    const ref=db.doc(path);
    const p=exists(path)?ref.update(patch):ref.set(stripNulls(patch));
    p.then(()=>{if(!exists(path))docs[path]=stripNulls(patch);else docs[path]=applyPatch(clone(docs[path]),patch);delete inflight[path];onChange();if(pend[path])flush(path)},
      e=>{delete inflight[path];if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){dead=true;toast(groupCode?'Modification refusée par la base : vérifie les règles Firebase.':'Tu peux consulter, mais pas modifier : demande un accès « Contributeur ».')}
        else toast('Enregistrement impossible pour le moment. Réessaie dans un instant.');onChange()})}
  /* Base Firebase (site hébergé hors de claude.ai). Les données d'un groupe vivent sous groups/<code secret>/… ;
     le code vient du lien (?g=…), il est gardé sur l'appareil, et il en est créé un nouveau s'il n'y en a pas. */
  let groupCode=null;
  function pickGroup(){let g=null;
    try{g=new URLSearchParams(location.search).get('g')}catch(e){}
    if(!g||!/^[A-Za-z0-9]{20,64}$/.test(g)){try{g=localStorage.getItem('fds:g')}catch(e){}}
    if(!g||!/^[A-Za-z0-9]{20,64}$/.test(g)){const abc='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',r=new Uint8Array(28);crypto.getRandomValues(r);g=Array.from(r,x=>abc[x%abc.length]).join('')}
    try{localStorage.setItem('fds:g',g)}catch(e){}
    try{const u=new URL(location.href);if(u.searchParams.get('g')!==g){u.searchParams.set('g',g);history.replaceState(null,'',u.toString())}}catch(e){}
    return g}
  async function cloudDb(){
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [{initializeApp},fs]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js')]);
    const fdb=fs.getFirestore(initializeApp(FIREBASE_CONFIG));groupCode=pickGroup();
    const conv=o=>{const r={};for(const k in o){const v=o[k];if(v===null)r[k]=fs.deleteField();else if(isObj(v)){const c=conv(v);if(Object.keys(c).length)r[k]=c}else r[k]=v}return r};
    const err=e=>({code:e&&e.code==='permission-denied'?'not_granted':'unavailable'});
    return {
      collection:c=>({onSnapshot:(next,fail)=>fs.onSnapshot(fs.collection(fdb,'groups',groupCode,c),
        snap=>next({docs:snap.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:{fromCache:snap.metadata.fromCache}}),e=>fail(err(e)))}),
      doc:path=>{const [c,id]=path.split('/'),ref=fs.doc(fdb,'groups',groupCode,c,id);
        return {update:p=>fs.setDoc(ref,conv(p),{merge:true}).catch(e=>{throw err(e)}),set:d=>fs.setDoc(ref,d).catch(e=>{throw err(e)})}}}}
  function startLocal(){mode='local';const all=ls.get('docs')||{};for(const k in all)docs[k]=all[k];COLLS.forEach(c=>loaded[c]=true);onChange()}
  async function init(cb){onChange=cb;
    let d=null;try{d=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){d=null}
    if(!d&&FIREBASE_CONFIG&&!(window.claude&&window.claude.use)){try{d=await cloudDb()}catch(e){d=null;groupCode=null}}
    if(!d){startLocal();return}
    db=d;mode='shared';
    const timer=setTimeout(()=>{stale=true;onChange()},10000);
    COLLS.forEach(c=>{db.collection(c).onSnapshot(snap=>{
        const seen={};snap.docs.forEach(s=>{seen[c+'/'+s.id]=1;docs[c+'/'+s.id]=clone(s.data())});
        for(const k in docs)if(k.startsWith(c+'/')&&!seen[k])delete docs[k];
        loaded[c]=true;if(!snap.metadata.fromCache&&COLLS.every(x=>loaded[x])){clearTimeout(timer);stale=false}
        onChange()},
      e=>{loaded[c]=true;clearTimeout(timer);dead=true;onChange()})});
    onChange()}
  return {get,exists,write,init,
    get mode(){return mode},get ready(){return mode!=='pending'&&COLLS.every(c=>loaded[c])},get stale(){return stale},get readonly(){return dead},
    /* Lien à envoyer aux deux autres (seulement en mode Firebase). */
    get link(){if(!groupCode)return null;try{const u=new URL(location.href);u.hash='';u.search='?g='+groupCode;return u.toString()}catch(e){return null}}}
})();

/* ---------- État d'interface ---------- */
const ui={tab:'semaine',week:defaultWeek(),me:null,edit:'p1',cat:'all',together:false,day:0,scope:'week',swap:null,showAll:false,arm:null,menu:false};
try{ui.me=localStorage.getItem('fds:me')||null;if(ui.me)ui.edit=ui.me}catch(e){}

const settings=()=>Store.get('group/settings');
const club=()=>'auteuil'; /* le club du groupe ; Beaugrenelle ne sert que pour un cours choisi à la main */
const weekPath=(k)=>'weeks/'+club()+'_'+(k||ui.week);
const week=(k)=>Store.get(weekPath(k));
const profile=p=>Store.get('profiles/'+p);
const NAMES={p1:'Cece',p2:'Coco',p3:'Clem'}; /* prénoms fixes */
const pname=p=>NAMES[p];
const initial=p=>{const n=NAMES[p];for(let k=1;k<=3;k++){const me=n.slice(0,k).toLowerCase();if(PEOPLE.every(q=>q===p||NAMES[q].slice(0,k).toLowerCase()!==me))return n.slice(0,k)}return n.slice(0,2)};
function availOf(p,k){const w=week(k).avail;const o=w&&w[p];const pr=profile(p);
  const a=(o&&o.a)||pr.avail||DEFAULT_AVAIL, m=(o&&o.m)||pr.modes||DEFAULT_MODES;
  const m2=m.length===7?m:DEFAULT_MODES;return {a:a.length===7*NB?normAvail(a,m2):DEFAULT_AVAIL,m:m2,custom:!!o}}
/* La semaine type seule, sans tenir compte d'une semaine personnalisée. */
function typeAvail(p){const pr=profile(p),a=pr.avail||DEFAULT_AVAIL,m=pr.modes||DEFAULT_MODES;
  const m2=m.length===7?m:DEFAULT_MODES;return {a:a.length===7*NB?normAvail(a,m2):DEFAULT_AVAIL,m:m2,custom:false}}
/* Ce qu'on affiche et modifie dans l'onglet Dispos, selon l'onglet « Semaine type » ou « Semaine du … ». */
function editAvail(p){return ui.scope==='week'?availOf(p):typeAvail(p)}
/* Les envies valent pour la semaine affichée seulement ; ailleurs tout est « Ok ». */
const prefOf=(p,course)=>{const v=((week().prefs||{})[p]||{})[course];return v===0||v===2?v:1};

/* ---------- Créneaux ---------- */
const slotCache={};
function clubSlots(c){const wd=WEEKDATA[ui.week],ck=c+'|'+(wd?ui.week:'');if(slotCache[ck])return slotCache[ck];const seen={},pre=c==='auteuil'?'':c==='inconnu'?'x_':'bg_';
  const out=((wd?wd[c]:DATA[c])||[]).map(r=>{const [studio,day,time,course,coach]=r;const [h,m]=time.split(':').map(Number);
    let id=pre+day+'-'+time.replace(':','')+'-'+course.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'');
    if(seen[id])id+='-'+(++seen[id]);else seen[id]=1;
    const meta=CATALOG[course]||{};
    return {id,club:c,studio,day,time,min:h*60+m,band:bandOf(h*60+m),course,coach,cat:CAT_OF[course]||null,dur:meta.dur||null,max:meta.max||null}});
  out.sort((a,b)=>a.day-b.day||a.min-b.min||a.course.localeCompare(b.course));
  return slotCache[ck]=out}
function slots(){return clubSlots('auteuil')}
/* Par défaut on propose les deux clubs, Auteuil de préférence. Une case peut être limitée à un seul lieu. */
const lieuAt=(d,b)=>{const v=(week().lieu||{})[d+'-'+b];return v==='auteuil'||v==='beaugrenelle'?v:null};
const candCacheW={};
function candidates(){const ck=WEEKDATA[ui.week]?ui.week:'';if(!candCacheW[ck])candCacheW[ck]=clubSlots('auteuil').concat(clubSlots('beaugrenelle'),ck?clubSlots('inconnu'):[]).sort((a,b)=>a.day-b.day||a.min-b.min||a.course.localeCompare(b.course)||(a.club<b.club?-1:1));
  const candCache=candCacheW[ck],l=week().lieu||{};if(!Object.keys(l).length)return candCache;
  return candCache.filter(s=>{const v=lieuAt(s.day,s.band);return !v||v===s.club})}
const GYM_TIMES=['07:00','08:15','09:30','10:45','12:00','12:30','13:15','14:45','16:00','17:15','18:30','19:45','21:00'];
function gymSlot(id){const m=/^gym_(\d)-(\d{2})(\d{2})$/.exec(id);if(!m)return null;const mn=+m[2]*60+ +m[3];
  const g=(week().gym||{})[m[1]+'-'+m[2]+m[3]],club=isObj(g)&&g.club==='beaugrenelle'?'beaugrenelle':'auteuil';
  return {id,gym:true,club,studio:'Salle',day:+m[1],time:m[2]+':'+m[3],min:mn,band:bandOf(mn),course:'SALLE',coach:CLUBS[club]+' · accès libre',cat:null,dur:null,max:null}}
/* Qui vient à une séance de salle : {p1:true,…}. Une ancienne séance notée « true » vaut pour les trois. */
function gymPart(key){const v=(week().gym||{})[key];if(v===true){const o={};PEOPLE.forEach(p=>o[p]=true);return o}
  if(isObj(v)&&PEOPLE.some(p=>v[p])){const o={};PEOPLE.forEach(p=>o[p]=!!v[p]);return o}return null}
function gymWho(g){const part=gymPart(g.id.slice(4))||{};return PEOPLE.map(p=>({p,a:1,pr:1,ok:!!part[p]}))}
const gymList=()=>Object.keys(week().gym||{}).filter(k=>gymPart(k)).map(k=>gymSlot('gym_'+k)).filter(Boolean);
const slotById=id=>String(id).startsWith('gym_')?gymSlot(id):clubSlots(String(id).startsWith('bg_')?'beaugrenelle':String(id).startsWith('x_')?'inconnu':'auteuil').find(s=>s.id===id);

const hhmm=t=>t.replace(':','h').replace(/^0/,'');
const DSHORT=['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
function today0(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
/* État d'inscription d'un créneau pour la semaine affichée : ouvert à partir de J-6. */
function booking(s){const cls=keyDate(ui.week,s.day),open=keyDate(ui.week,s.day-BOOK_AHEAD),t=today0();
  const dOpen=Math.round((open-t)/864e5),dCls=Math.round((cls-t)/864e5);
  const lbl=DSHORT[(open.getDay()+6)%7]+' '+open.getDate()+' '+MONTHS[open.getMonth()];
  const nw=new Date();
  if(dCls<0||(dCls===0&&nw.getHours()*60+nw.getMinutes()>=s.min))return {st:'past',txt:'Cours passé',cls:''};
  if(dOpen<=0)return {st:'open',txt:'Inscriptions ouvertes',cls:'ok',open,lbl};
  return {st:'soon',txt:'Inscription dès '+(dOpen===1?'demain':lbl),cls:'warn',open,lbl,dOpen}}
/* Dispos de la semaine à confirmer avant la première ouverture d'inscriptions (le lundi s'ouvre le mardi d'avant). */
const DLONG=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const longDate=d=>DLONG[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTHS[d.getMonth()];
function confirmInfo(){const firstOpen=keyDate(ui.week,-BOOK_AHEAD),deadline=keyDate(ui.week,-BOOK_AHEAD-1);
  const conf=week().confirmed||{},done=PEOPLE.filter(p=>conf[p]),left=Math.round((deadline-today0())/864e5);
  return {firstOpen,deadline,conf,done,all:done.length===3,left}}
function placesOf(id){const p=(week().places||{})[id];return typeof p==='number'?p:null}

/* Qui peut venir à ce créneau : dispo (1 possible, 2 idéal) et pas de veto sur le cours. */
function who(s){const wk=week(),out=(wk.out||{})[s.id]||{},inP=s.cat&&(wk.plan||{})[s.cat]===s.id,mine=inP?(wk.by||{})[s.cat]:null,go=inP&&isObj((wk.go||{})[s.id])?wk.go[s.id]:null;
  return PEOPLE.map(p=>{const a=+availOf(p).a[s.day*NB+s.band]||0;const pr=prefOf(p,s.course),own=!go&&mine===p;
    return {p,a,pr,own,go:!!go,cand:!inP,inv:(((wk.invites||{})[s.id]||{}).to||{})[p]||null,out:!!out[p],ok:go?!!go[p]&&!out[p]:(own||(a>0&&pr>0))&&!out[p]}})}
/* Places qu'il faut encore trouver : celles qui peuvent venir et n'ont pas déjà réservé. */
function needOf(s,w){const bk=(week().booked||{})[s.id]||{};return w.filter(x=>x.ok&&!bk[x.p]).length}
function shortOf(s,w){const pl=placesOf(s.id),need=needOf(s,w);return pl!==null&&need>0&&pl<need}
function scoreSlot(s,prevPlan){
  if(booking(s).st==='past')return null;
  const w=who(s),att=w.filter(x=>x.ok);let sc=0;
  att.forEach(x=>{sc+=(x.a===2?1.35:1)*(x.pr===2?1.5:1)});
  if(att.length===3)sc+=2.5;
  const pl=placesOf(s.id),bkd=(week().booked||{})[s.id]||{},need=needOf(s,w),anyBk=att.some(x=>bkd[x.p]);
  if(pl===0&&need>0)return null;
  if(pl!==null&&pl<need)sc*=0.35;
  if(s.club!=='auteuil'&&lieuAt(s.day,s.band)!=='beaugrenelle')sc-=0.4; /* Auteuil de préférence */
  if(pl===null&&s.max&&s.max<=6)sc-=0.8; /* petite salle : trois places libres d'un coup sont peu probables */
  att.forEach(x=>{if(bkd[x.p])sc+=1.2}); /* place déjà prise (réinscription) */
  /* Sans coup de cœur ni place déjà prise, on évite de refaire le même cours que la semaine d'avant. */
  if(prevPlan&&!anyBk&&!att.some(x=>x.pr===2)&&Object.values(prevPlan).some(id=>{const p=slotById(id);return p&&p.course===s.course}))sc-=2;
  return {s,sc,n:att.length,w}}
function recommend(lock,me){
  const prevPlan=week(shiftWeek(ui.week,-1)).plan||null;
  const by={};CATS.forEach(([c])=>by[c]=[]);
    candidates().forEach(s=>{if(!s.cat)return;const r=scoreSlot(s,prevPlan);if(r&&r.n>=1&&(!me||r.w.some(x=>x.p===me&&x.ok)))by[s.cat].push(r)});
  CATS.forEach(([c])=>{by[c].sort((a,b)=>b.sc-a.sc)});
  const top={},pins=week().pins||{},pinned={};
  CATS.forEach(([c])=>{const fid=(lock&&lock[c])||pins[c],ps=fid&&slotById(fid);let pr=ps&&scoreSlot(ps,prevPlan);
    if(ps&&!pr&&lock&&lock[c]){const w=who(ps);pr={s:ps,sc:0,n:w.filter(x=>x.ok).length,w}} /* déjà validé : on le garde quoi qu'il arrive */
    if(pr&&!(lock&&lock[c])&&pr.n===0)pr=null; /* cours choisi où plus personne n'est dispo : on ne l'impose plus */
    if(pr){pinned[c]=1;top[c]=[pr]}else top[c]=by[c].slice(0,36)});
  const gymDays=new Set(gymList().map(g=>g.day));
  const combos=[];
  for(const f of top.force)for(const c of top.cardio)for(const m of top.mobilite){
    let sc=f.sc+c.sc+m.sc;const ds=[f.s,c.s,m.s];let clash=false;
    for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){const a=ds[i],b=ds[j];
      if(a.day===b.day)clash=true; /* un seul cours par jour */
      else if(Math.abs(a.day-b.day)===1)sc-=3.5; /* de préférence un jour de pause entre deux séances */
      else sc+=0.4}
    if(clash)continue;
    ds.forEach(x=>{if(gymDays.has(x.day)&&!(lock&&lock[x.cat]))sc-=3}); /* pas de cours un jour de salle, si possible */
    combos.push({sc,pick:{force:f,cardio:c,mobilite:m}})}
  combos.sort((a,b)=>b.sc-a.sc);
  /* Diversité : chaque plan suivant évite les créneaux, les cours et les jours déjà proposés. */
  const plans=[],pool=combos.slice(0,6000);
  while(plans.length<3&&pool.length){
    let best=null,bestV=-1e9;
    for(const co of pool){let v=co.sc;
      for(const p of plans)for(const [c] of CATS){if(pinned[c])continue;const x=co.pick[c].s,y=p.pick[c].s;
        if(x.id===y.id)v-=100;else{if(x.course===y.course)v-=1.2;if(x.day===y.day)v-=1.5}}
      if(v>bestV){bestV=v;best=co}}
    if(!best||(plans.length&&bestV<-50))break;
    plans.push(best);pool.splice(pool.indexOf(best),1)}
  return {plans,by}}

/* Une semaine sur 7 colonnes : les séances posées sur leur jour, les jours de repos laissés vides. */
/* Catégories dont le cours imposé tombe sur cette case (jour + tranche). */
function cellPins(d,b){const pins=week().pins||{};return CATS.map(([c])=>c).filter(c=>{const x=pins[c]&&slotById(pins[c]);return x&&x.day===d&&x.band===b})}
/* Créneaux « à part » déjà retenus : week.solo[personne][catégorie] = id du créneau. */
/* Quitter le cours du groupe d'une catégorie : il reste aux autres ; s'il n'y a plus personne, il part. */
function leaveP(patch,cat,me){const id=(week().plan||{})[cat],x=id&&slotById(id);if(!x)return false;
  const rest=who(x).filter(w=>w.ok&&w.p!==me);
  if(!rest.length){patch.plan[cat]=null;patch.by[cat]=null;patch.pins[cat]=null;return false}
  const g={};PEOPLE.forEach(q=>g[q]=rest.some(w=>w.p===q)?true:null);patch.go[id]=g;return true}
/* Ajouter un cours pour une personne. Les autres gardent le leur : seule sa semaine change. */
function addPatch(sl,rm,me,soloOnly){const p=week().plan||{},so=(week().solo||{})[me]||{},patch={plan:{},by:{},pins:{[sl.cat]:null},go:{},solo:{[me]:{}}};
  if(p[sl.cat]===sl.id){const g={};who(sl).forEach(w=>{if(w.ok)g[w.p]=true});g[me]=true;patch.go[sl.id]=g;patch.out={[sl.id]:{[me]:null}};patch.solo[me][sl.cat]=null}
  else if(leaveP(patch,sl.cat,me)||soloOnly)patch.solo[me][sl.cat]=sl.id;
  else{patch.plan[sl.cat]=sl.id;patch.by[sl.cat]=me;patch.go[sl.id]={[me]:true};patch.solo[me][sl.cat]=null}
  CATS.forEach(([c])=>{if(c===sl.cat)return;const x=p[c]&&slotById(p[c]);
    if(x&&(x.day===sl.day||c===rm)&&who(x).some(w=>w.p===me&&w.ok))leaveP(patch,c,me);
    const y=so[c]&&slotById(so[c]);if(y&&(y.day===sl.day||c===rm))patch.solo[me][c]=null});
  return patch}
function soloList(){const so=week().solo||{},out=[];PEOPLE.forEach(p=>CATS.forEach(([c])=>{const id=so[p]&&so[p][c],sl=id&&slotById(id);if(sl)out.push({p,c,s:sl})}));return out}
/* Meilleur créneau de la même catégorie pour une personne seule, un jour où elle n'a pas déjà une séance. */
/* Jours déjà pris pour une personne, hors catégorie donnée : cours du groupe où elle vient, créneaux à part, salle. */
function busyDays(p,cat,pick){return CATS.filter(([c])=>c!==cat&&pick[c]&&pick[c].w.some(x=>x.p===p&&x.ok)).map(([c])=>pick[c].s.day)
  .concat(soloList().filter(o=>o.p===p&&o.c!==cat).map(o=>o.s.day))
  .concat(gymList().filter(g=>gymWho(g).some(x=>x.p===p&&x.ok)).map(g=>g.day))}
/* Celles qui ne sont pas au cours du groupe de cette catégorie et n'ont pas encore retenu de créneau à part. */
function awayFrom(cat,pick){const so=week().solo||{};return pick[cat]?pick[cat].w.filter(x=>!x.ok&&!(so[x.p]&&so[x.p][cat])).map(x=>x.p):[]}
/* Créneaux à part pour une personne. On classe d'abord ceux où les autres absentes peuvent venir aussi
   (même calcul pour chacune, donc la même proposition), puis ceux déjà retenus par une autre. */
function soloOptions(p,cat,pick,n,extraBusy){
  const kept=new Set(soloList().filter(o=>o.p!==p&&o.c===cat).map(o=>o.s.id));
  const group=[p].concat(awayFrom(cat,pick).filter(q=>q!==p)),busy={};
  group.forEach(q=>busy[q]=busyDays(q,cat,pick).concat(q===p?(extraBusy||[]):[]));
  const val=(q,sl)=>{if(busy[q].includes(sl.day))return null;const x=who(sl).find(y=>y.p===q);if(!x.ok)return null;
    return (x.a===2?1.35:1)*(x.pr===2?1.5:1)-(busy[q].some(d=>Math.abs(d-sl.day)===1)?1:0)};
  const out=[];
  candidates().forEach(sl=>{if(sl.cat!==cat||booking(sl).st==='past'||placesOf(sl.id)===0)return;
    const mine=val(p,sl);if(mine===null)return;
    const vs=group.map(q=>val(q,sl)).filter(v=>v!==null);
    out.push({s:sl,k:vs.length+(kept.has(sl.id)?1:0),v:vs.reduce((a,b)=>a+b,0)-(sl.club!=='auteuil'?0.4:0),
      withs:group.filter(q=>q!==p&&val(q,sl)!==null)})});
  out.sort((a,b)=>b.k-a.k||b.v-a.v||a.s.day-b.s.day||a.s.min-b.s.min||a.s.course.localeCompare(b.s.course));
  const pickd=[];for(const o of out){if(pickd.some(q=>q.s.course===o.s.course&&q.s.day===o.s.day))continue;pickd.push(o);if(pickd.length>=(n||4))break}
  return pickd.map(o=>Object.assign({},o.s,{withs:o.withs}))}
function soloFor(p,cat,pick,extraBusy){return soloOptions(p,cat,pick,1,extraBusy)[0]||null}

function strip(pick,opts){const byDay={},add=(d,c,r)=>(byDay[d]=byDay[d]||[]).push([c,r]);

      if(!(so[me]&&so[me][c])&&!r.w.some(x=>x.p===me&&x.inv==='ask')){const a=soloFor(me,c,pick,sugDays);  /* ma proposition à la place du cours du groupe */
        if(a){sugDays.push(a.day);add(a.day,c,{s:a,w:soloList().filter(o=>o.s.id===a.id&&o.p!==me).map(o=>({p:o.p,ok:true,a:1,pr:1})),n:1,suggest:true,also:a.withs||[]})}}
      return}
    add(r.s.day,c,r)});
  ((opts&&opts.gyms)||[]).forEach(g=>{const w=gymWho(g);if(mine(w))add(g.day,'x',{s:g,w,n:w.filter(x=>x.ok).length})});
  const grp={};((opts&&opts.solos)||[]).forEach(o=>{const k=o.c+'|'+o.s.id;(grp[k]=grp[k]||{c:o.c,s:o.s,ps:[]}).ps.push(o.p)});
  Object.values(grp).forEach(g=>{if(me&&!g.ps.includes(me))return;
    add(g.s.day,g.c,{s:g.s,w:who(g.s).map(x=>Object.assign({},x,{ok:g.ps.includes(x.p),cand:false,solo:true})),n:g.ps.length})});
  ((opts&&opts.invs)||[]).forEach(o=>add(o.s.day,o.s.cat||'x',{s:o.s,w:(o.s.gym?gymWho(o.s):who(o.s)).map(x=>!o.s.gym&&((week().solo||{})[x.p]||{})[o.s.cat]===o.s.id?Object.assign({},x,{ok:true,cand:false}):x),n:0,invite:o.from}));

  return h+`</div>`}

function confirmBanner(){const c=confirmInfo(),miss=PEOPLE.filter(p=>!c.conf[p]);

  else if(a==='choose'){const pl=recommend(planState().lock,ui.me).plans[+el.dataset.i];if(pl){const plan={},by={},old=week().plan||{};CATS.forEach(([c])=>{plan[c]=pl.pick[c].s.id;if(old[c]!==plan[c])by[c]=ui.me||null});save(weekPath(),{plan,by});ui.showAll=false;toast('Plan retenu.')}}
  else if(a==='setplan'&&!ui.me&&(()=>{const c=el.dataset.cat,rm=el.dataset.rm,d=slotById(el.dataset.id).day,p=week().plan||{};
      return CATS.some(([k])=>k!==c&&k!==rm&&p[k]&&slotById(p[k])&&slotById(p[k]).day===d)})()){toast('Vous avez déjà un cours ce jour-là : un seul cours par jour.');return}
  else if(a==='setplan'){const c=el.dataset.cat,rm=el.dataset.rm;let patch={plan:{[c]:el.dataset.id},by:{[c]:null}};
    if(ui.me)patch=addPatch(slotById(el.dataset.id),rm&&rm!==c?rm:null,ui.me);
    else if(rm&&rm!==c){patch.plan[rm]=null;patch.by[rm]=null;patch.pins={[rm]:null}}
    if(ui.me){dlgCat=null;dlgPick=null;ui.rf=null;ui.rfOpen=null;dlgSlot=null;dlgInv={id:el.dataset.id,patch,inv:invDefault(el.dataset.id)};render();openDlg();return}
    save(weekPath(),patch);
    if(dlgSlot||dlgCat){closeDlg();toast('Ajouté à votre semaine.')}}
  else if(a==='clearplan'){save(weekPath(),{plan:null,solo:null,out:null,by:null,go:null});ui.swap=null}
  else if(a==='confirm'){const cur=(week().confirmed||{})[ui.edit];save(weekPath(),{confirmed:{[ui.edit]:cur?null:true}});if(!cur)toast('Dispos validées.')}
  else if(a==='resetweek'){save(weekPath(),{avail:{[ui.edit]:null}})}
  else if(a==='typesave'){if(dlgType){const d=dlgType;saveAvail(d.p,d.a,d.m,true);closeDlg();toast('Semaine type de '+pname(d.p)+' enregistrée.')}}
  else if(a==='cell'&&el.dataset.t==='1'){if(dlgType){const i=+el.dataset.d*NB+ +el.dataset.b,nv=((+dlgType.a[i]||0)+1)%3;dlgType.a=dlgType.a.slice(0,i)+nv+dlgType.a.slice(i+1);renderDlg()}return}
  else if(a==='cell'){const p=ui.edit,av=availOf(p),i=+el.dataset.d*NB+ +el.dataset.b;const nv=((+av.a[i]||0)+1)%3;
    saveAvail(p,av.a.slice(0,i)+nv+av.a.slice(i+1),av.m,false)}
  else if(a==='pref'){const p=ui.edit;save(weekPath(),{prefs:{[p]:{[el.dataset.c]:+v===1?null:+v}}})}
  else return;
  render()});
/* Glisser une séance des propositions vers « Notre semaine » pour l'ajouter (ordinateur). */
let dragId=null;
function dragMark(on){try{document.body.classList.toggle('dragging',on);document.querySelectorAll('.day.drop').forEach(x=>x.classList.remove('drop'));
  if(on){const sl=slotById(dragId),t=sl&&document.querySelector('.week7.pickable .day[data-d="'+sl.day+'"]');if(t)t.classList.add('drop')}}catch(e){}}
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('.sess[draggable]');if(!el)return;dragId=el.dataset.id;
  try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='copy'}catch(x){}dragMark(true)});
document.addEventListener('dragover',e=>{if(dragId&&e.target.closest&&e.target.closest('.week7.pickable')){e.preventDefault();try{e.dataTransfer.dropEffect='copy'}catch(x){}}});
document.addEventListener('drop',e=>{if(!dragId||!(e.target.closest&&e.target.closest('.week7.pickable')))return;e.preventDefault();
  const sl=slotById(dragId);dragMark(false);dragId=null;if(!sl||!sl.cat)return;
  if(dayTaken(sl.cat,sl.day)){toast('Vous avez déjà un cours ce jour-là : un seul cours par jour.');return}
  save(weekPath(),{plan:{[sl.cat]:sl.id},by:{[sl.cat]:ui.me||null}});toast(sl.course+' de '+DAYS[sl.day].toLowerCase()+' ajouté à votre semaine.');render()});
document.addEventListener('dragend',()=>{dragMark(false);dragId=null});
/* Clic droit (ordinateur) ou appui long (téléphone) sur une case : choisir un cours précis à cette heure. */
let lpT=null,lpDone=false;
/* Heures où il existe au moins un cours ce jour-là (tous clubs). */
function bandsWith(d){const set=new Set();['auteuil','beaugrenelle','inconnu'].forEach(c=>clubSlots(c).forEach(x=>{if(x.day===d&&x.cat)set.add(x.band)}));return set}
function dayBand(d){const bs=[...bandsWith(d)].sort((a,b)=>Math.abs(a-6)-Math.abs(b-6));return bs.length?bs[0]:6}
function pickTarget(e){const t=e.target;if(!t.closest)return null;
  const c=t.closest('.cell');if(c)return c.dataset.t==='1'?null:{d:+c.dataset.d,b:+c.dataset.b,cell:true};
  return null}
function pickFrom(p){ui.rfOpen=null;ui.rf=p.cell?{parts:[p.b<=2?'am':p.b<=4?'pm':'eve']}:null;dlgPick=p;dlgSlot=null;dlgCat=null;dlgGym=null;dlgType=null;openDlg()}
document.addEventListener('contextmenu',e=>{const p=pickTarget(e);if(!p)return;e.preventDefault();pickFrom(p)});
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const p=pickTarget(e);if(!p)return;
  lpDone=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpDone=true;pickFrom(p)},550)});
['pointerup','pointercancel','pointermove'].forEach(t=>document.addEventListener(t,e=>{if(t!=='pointermove'||Math.abs(e.movementX)+Math.abs(e.movementY)>6)clearTimeout(lpT)}));
document.addEventListener('change',e=>{const el=e.target;const a=el.dataset&&el.dataset.act;
  if(a==='mode'&&el.dataset.t==='1'){if(dlgType){const d=+el.dataset.d,k=el.value;dlgType.a=dlgType.a.slice(0,d*NB)+PRESET[k]+dlgType.a.slice((d+1)*NB);dlgType.m=dlgType.m.slice(0,d)+k+dlgType.m.slice(d+1);renderDlg()}}
  else if(a==='mode'){const p=ui.edit,av=availOf(p),d=+el.dataset.d,k=el.value;
    saveAvail(p,av.a.slice(0,d*NB)+PRESET[k]+av.a.slice((d+1)*NB),av.m.slice(0,d)+k+av.m.slice(d+1),false);render()}
  else if(a==='together'){ui.together=el.checked;render()}
});
function fromHash(){try{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))ui.tab=h}catch(e){}}
fromHash();
try{window.addEventListener('hashchange',()=>{fromHash();render()})}catch(e){}
render();
Store.init(render);
</script>
